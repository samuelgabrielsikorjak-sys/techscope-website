<!doctype html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Klientský portál — TECH-SCOPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-punct">&lt;</span>techscope<span class="logo-punct logo-cursor">_</span></a><span class="logo-admin-tag">klient</span>
    <div class="nav-cta">
      <span id="klient-nav-actions"></span>
      <button class="nav-toggle" aria-label="Otvoriť menu" aria-expanded="false">☰</button>
    </div>
  </div>
</nav>

<section id="login-section">
  <div class="container" style="max-width:420px;">
    <div class="section-head">
      <div class="eyebrow">Klientský portál</div>
      <h2>Prihlásenie</h2>
    </div>
    <div class="form-card">
      <div class="form-banner-error" id="login-error"></div>
      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label for="login-heslo">Heslo</label>
          <input type="password" id="login-heslo" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Prihlásiť sa</button>
      </form>
    </div>
  </div>
</section>

<section id="portal-section" style="display:none;"></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/script.js"></script>
<script src="assets/klient.js"></script>
</body>
</html>
